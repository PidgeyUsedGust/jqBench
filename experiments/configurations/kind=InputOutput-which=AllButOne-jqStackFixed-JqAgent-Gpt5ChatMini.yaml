# Historical identity retained; model.id selects fresh OpenRouter runs.
source: data
dataset: jqStack.jsonl
solver:
  name: JqAgent
  documentation: false
  iterations: 8
  implicit: false
input:
  kind: InputOutput
  which: AllButOne
model:
  name: Gpt5ChatMini
  n: 1
  temperature: 0.0
  reasoning: null
  id: null
cache: solve/kind=InputOutput-which=AllButOne/jqStackFixed-JqAgent-Gpt5ChatMini.json
output: fixed/kind=InputOutput-which=AllButOne/jqStackFixed-JqAgent-Gpt5ChatMini.json
