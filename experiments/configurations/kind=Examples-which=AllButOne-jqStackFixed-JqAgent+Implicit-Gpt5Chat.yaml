# Historical identity retained; model.id selects fresh OpenRouter runs.
source: data
dataset: jqStack.jsonl
solver:
  name: JqAgent
  documentation: false
  iterations: 8
  implicit: true
input:
  kind: Examples
  which: AllButOne
model:
  name: Gpt5Chat
  n: 1
  temperature: 0.0
  reasoning: null
  id: null
cache: solve/kind=Examples-which=AllButOne/jqStackFixed-JqAgent+Implicit-Gpt5Chat.json
output: fixed/kind=Examples-which=AllButOne/jqStackFixed-JqAgent+Implicit-Gpt5Chat.json
