# Historical identity retained; model.id selects fresh OpenRouter runs.
source: data
dataset: jqSpider.jsonl
solver:
  name: PythonAgent
  iterations: 8
  implicit: true
input:
  kind: Schema
  which: Na
model:
  name: Gpt41Mini
  n: 1
  temperature: 0.0
  reasoning: null
  id: openai/gpt-4.1-mini
cache: solve/kind=Schema-which=Na/spider-PythonAgent+Implicit-Gpt41Mini.json
output: spider/kind=Schema-which=Na/spider-PythonAgent+Implicit-Gpt41Mini.json
