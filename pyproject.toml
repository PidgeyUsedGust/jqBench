[project]
name = "jqbench"
version = "0.1.0"
description = "Load, execute, and evaluate JSON transformation benchmarks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jq>=1.8",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jqbench"]

[tool.hatch.build.targets.sdist]
include = ["jqbench", "pyproject.toml", "README.md"]

[project.optional-dependencies]
hub = ["datasets>=3", "huggingface-hub>=0.24"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
research = [
    "jinja2>=3",
    "jsonargparse>=4",
    "jsonschema>=4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6",
    "rich>=13",
    "scipy>=1.12",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "tabulate>=0.9",
    "tqdm>=4",
    "upsetplot>=0.9",
]

[tool.uv]
default-groups = ["dev", "research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
